name: Build Chat S Demo APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Chat S ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: user
            app_id: com.chats.mobile.user
            label: User
            artifact: chat-s-user-demo-apk
          - mode: admin
            app_id: com.chats.mobile.admin
            label: Admin
            artifact: chat-s-admin-demo-apk
    env:
      APP_MODE: ${{ matrix.mode }}
      APP_ID: ${{ matrix.app_id }}
      APP_LABEL: ${{ matrix.label }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.chats.mobile .
          python3 - <<'PY'
          import os
          from pathlib import Path

          app = next((p for p in (Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")) if p.exists()), None)
          if app is None:
              raise SystemExit("Android app Gradle file was not generated")

          lines = app.read_text().splitlines()
          index = next((i for i, line in enumerate(lines) if "applicationId" in line and not line.strip().startswith("//")), None)
          if index is None:
              raise SystemExit("Could not find Android applicationId")
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = indent + (f'applicationId = "{os.environ["APP_ID"]}"' if app.suffix == ".kts" else f'applicationId "{os.environ["APP_ID"]}"')
          app.write_text(chr(10).join(lines) + chr(10))

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("Android manifest was not generated")
          manifest_text = manifest.read_text()
          manifest_text = manifest_text.replace('android:label="chat_s"', f'android:label="Chat S {os.environ["APP_LABEL"]}"')
          manifest.write_text(manifest_text)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Build local demo APK
        run: flutter build apk --release --dart-define=APP_MODE=${{ matrix.mode }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
