name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.chats.mobile .
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = next((p for p in (Path("android/settings.gradle.kts"), Path("android/settings.gradle")) if p.exists()), None)
          app = next((p for p in (Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")) if p.exists()), None)
          if settings is None or app is None:
              raise SystemExit("Android Gradle files were not generated")

          settings_text = settings.read_text()
          if "com.google.gms.google-services" not in settings_text:
              if settings.suffix == ".kts":
                  pattern = r'(?m)^(\\s*id\\(["\\']org\\.jetbrains\\.kotlin\\.android["\\'].*\\)\\s*)$'
                  replacement = r'\\1\\n    id("com.google.gms.google-services") version "4.4.2" apply false'
              else:
                  pattern = r'(?m)^(\\s*id ["\\']org\\.jetbrains\\.kotlin\\.android["\\'].*)$'
                  replacement = r'\\1\\n    id "com.google.gms.google-services" version "4.4.2" apply false'
              updated, count = re.subn(pattern, replacement, settings_text, count=1)
              if count != 1:
                  raise SystemExit("Could not add Google Services plugin to settings")
              settings.write_text(updated)

          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              if app.suffix == ".kts":
                  pattern = r'(?m)^(\\s*id\\(["\\']com\\.android\\.application["\\']\\)\\s*)$'
                  replacement = r'\\1\\n    id("com.google.gms.google-services")'
              else:
                  pattern = r'(?m)^(\\s*id ["\\']com\\.android\\.application["\\']\\s*)$'
                  replacement = r'\\1\\n    id "com.google.gms.google-services"'
              updated, count = re.subn(pattern, replacement, app_text, count=1)
              if count != 1:
                  raise SystemExit("Could not apply Google Services plugin to app")
              app_text = updated

          if app.suffix == ".kts":
              app_text, count = re.subn(r'applicationId\\s*=\\s*["\\'][^"\\']+["\\']', 'applicationId = "com.chats.mobile"', app_text, count=1)
          else:
              app_text, count = re.subn(r'applicationId\\s+["\\'][^"\\']+["\\']', 'applicationId "com.chats.mobile"', app_text, count=1)
          if count != 1:
              raise SystemExit("Could not set Android applicationId to com.chats.mobile")
          app.write_text(app_text)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-s-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
