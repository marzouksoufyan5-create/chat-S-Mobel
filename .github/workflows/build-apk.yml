name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.chats.mobile .
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          settings = next((p for p in (Path("android/settings.gradle.kts"), Path("android/settings.gradle")) if p.exists()), None)
          app = next((p for p in (Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")) if p.exists()), None)
          if settings is None or app is None:
              raise SystemExit("Android Gradle files were not generated")

          settings_lines = settings.read_text().splitlines()
          if not any("com.google.gms.google-services" in line for line in settings_lines):
              index = next((i for i, line in enumerate(settings_lines) if "org.jetbrains.kotlin.android" in line), None)
              if index is None:
                  raise SystemExit("Could not find Kotlin plugin in Gradle settings")
              plugin = '    id("com.google.gms.google-services") version "4.4.2" apply false' if settings.suffix == ".kts" else '    id "com.google.gms.google-services" version "4.4.2" apply false'
              settings_lines.insert(index + 1, plugin)
              settings.write_text("\n".join(settings_lines) + "\n")

          app_lines = app.read_text().splitlines()
          if not any("com.google.gms.google-services" in line for line in app_lines):
              index = next((i for i, line in enumerate(app_lines) if "com.android.application" in line), None)
              if index is None:
                  raise SystemExit("Could not find Android application plugin")
              plugin = '    id("com.google.gms.google-services")' if app.suffix == ".kts" else '    id "com.google.gms.google-services"'
              app_lines.insert(index + 1, plugin)

          index = next((i for i, line in enumerate(app_lines) if "applicationId" in line and not line.strip().startswith("//")), None)
          if index is None:
              raise SystemExit("Could not find Android applicationId")
          indent = app_lines[index][:len(app_lines[index]) - len(app_lines[index].lstrip())]
          app_lines[index] = indent + ('applicationId = "com.chats.mobile"' if app.suffix == ".kts" else 'applicationId "com.chats.mobile"')
          app.write_text("\n".join(app_lines) + "\n")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-s-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
